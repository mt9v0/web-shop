<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mt9v0 — интернет-магазин</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="container header__content">
      <h1 class="logo">
        <svg class="logo__icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 8h14l-1 12H6L5 8z"/>
          <path d="M9 8V6a3 3 0 0 1 6 0v2"/>
        </svg>
        <span>mt9v0</span>
      </h1>
      <button id="cart-toggle-btn" class="btn" type="button">
        Корзина (<span id="cart-count">0</span>)
      </button>
    </div>
  </header>

  <main class="container main-content">
    <section class="catalog-section">
      <h2 class="section-title">Каталог товаров</h2>
      <div id="product-list" class="product-grid"></div>
    </section>

    <aside id="cart-section" class="cart-section" aria-label="Корзина">
      <h2 class="section-title">Корзина</h2>
      <div id="cart-items" class="cart-items">
        <p class="empty-msg">Корзина пуста</p>
      </div>
      <div class="cart-summary">
        <p class="cart-summary__total">Итого: <strong id="cart-total">0</strong> ₽</p>
        <button id="checkout-btn" class="btn btn--primary" type="button" disabled>Оформить заказ</button>
      </div>
    </aside>
  </main>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button id="modal-close-btn" class="modal__close" type="button" aria-label="Закрыть">&times;</button>
      <h3 id="modal-title" class="modal__title">Оформление заказа</h3>
      <form id="order-form" class="order-form">
        <div class="form-group">
          <label for="first-name">Имя:</label>
          <input type="text" id="first-name" required placeholder="Роман">
        </div>
        <div class="form-group">
          <label for="last-name">Фамилия:</label>
          <input type="text" id="last-name" required placeholder="Ротенберг">
        </div>
        <div class="form-group">
          <label for="address">Адрес доставки:</label>
          <input type="text" id="address" required placeholder="г. Казань, ул. Марата, д. 15">
        </div>
        <div class="form-group">
          <label for="phone">Контактный номер телефона:</label>
          <input type="tel" id="phone" required placeholder="+7 (812) 666-00-52">
        </div>
        <button type="submit" class="btn btn--success">Создать заказ</button>
      </form>
      <div id="order-success-msg" class="success-msg hidden">
        Заказ создан!
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
